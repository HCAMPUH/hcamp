name: strapi-next-starter

services:
  db:
    platform: linux/amd64 # For platform compatibility on Apple Silicon (M1/M2/M3/M4)
    restart: unless-stopped
    env_file: .env
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - data:/var/lib/postgresql/data
      # - ./data:/var/lib/postgresql/data # Bind mount option
    ports:
      - "127.0.0.1:5432:5432" # Safe for local host access (Strapi on host)
    networks:
      - db_network

  # Optional: image processing proxy for local development.
  # Start with: pnpm run:imgproxy (or docker compose up -d imgproxy)
  # Then set IMGPROXY_URL=http://localhost:8080 in apps/ui/.env.local
  imgproxy:
    image: darthsim/imgproxy:v3.24.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # Bound to localhost to prevent local network exposure
    environment:
      IMGPROXY_BIND: ":8080"
    profiles:
      - imgproxy

volumes:
  data:

networks:
  db_network:
    driver: bridge